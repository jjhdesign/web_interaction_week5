<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>카드 뒤집기 & 섞기</title>
    <style>
      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #000000;
        background-image: url("1.png");
        background-repeat: no-repeat;
        background-position: center;
        background-size: 75%;
        background-attachment: fixed;
        overflow: hidden;
      }

      /* 메인 레이아웃을 위한 컨테이너 */
      .main-layout {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 1200px; /* 최대 너비를 지정하여 너무 커지지 않게 합니다 */
        margin-top: -10%;
      }

      .controls {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        width: 100%;
        padding: 20px 0;
        margin-bottom: 15%; /* 카드 컨테이너와의 간격 */
      }

      .controls p {
        color: white;
        font-size: 3vw;
        margin: 0;
        text-align: left;
      }

      button {
        padding: 0.7vw 20px;
        margin-top: 1.5%;
        font-size: 16px;
        cursor: pointer;
        border: none;
        border-radius: 5px;
        background-color: #007bff;
        color: white;
        transition: background-color 0.3s;
      }

      button:hover {
        background-color: #0056b3;
      }

      .card-container-wrapper {
        display: flex;
        flex-wrap: wrap;
        row-gap: 4vw;
        column-gap: 2%;
        justify-content: center;
        width: 90%;
      }
      .card-container {
        width: 10vmin;
        height: 10vmin;
        perspective: 1000px;
        cursor: pointer;
      }

      .card {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.6s;
      }

      .card.flipped {
        transform: rotateY(180deg);
      }

      .card-face {
        position: absolute;
        width: 100%;
        height: 150%;
        backface-visibility: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        font-size: 1vw;
        text-align: center;
        line-height: 1.2;
        padding: 5px;
        box-sizing: border-box;
      }

      .card-front {
        background: rgb(255, 255, 255);
        color: #333;
        transform: rotateY(0deg);
        background-image: url("2.png");
        background-size: 170%;
        background-position: center;
        background-repeat: no-repeat;
      }

      .card-back {
        background: rgb(255, 255, 255);
        color: rgb(0, 0, 0);
        transform: rotateY(180deg);
        background-image: url("3.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }

      .secret {
        font-size: 0.5vw;
        line-height: 1.1;
      }
    </style>
  </head>
  <body>
    <div class="main-layout">
      <div class="controls">
        <p>질문에 대답할 사람을 뽑아봅시다</p>
        <button id="shuffle-button">카드 섞기</button>
      </div>
      <div class="card-container-wrapper"></div>
    </div>

    <script>
      const names =
        "강연우 김노현 김민주 김서연 김소영 김아현 김유진 김채영 김채은 민서 박세연 응우옌비엣호안 이슬비 이예림 장성주 장자윤 정세원 정유진 정재현 조진우 하지민 한평강 박지원";
      const nameList = names.split(" ");
      const cardWrapper = document.querySelector(".card-container-wrapper");

      function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
      }

      function renderCards(list) {
        cardWrapper.innerHTML = "";
        list.forEach((name) => {
          const cardContainer = document.createElement("div");
          cardContainer.classList.add("card-container");

          const card = document.createElement("div");
          card.classList.add("card");

          if (name === "정재현") {
            card.innerHTML = `
              <div class="card-face card-front"></div>
              <div class="card-face card-back">
                <span>${name}</span>
                <span class="secret">설마 내가 걸리겠어?</span>
              </div>
            `;
          } else {
            card.innerHTML = `
              <div class="card-face card-front"></div>
              <div class="card-face card-back">${name}</div>
            `;
          }

          card.addEventListener("click", () => {
            card.classList.toggle("flipped");
          });

          cardContainer.appendChild(card);
          cardWrapper.appendChild(cardContainer);
        });
      }

      const shuffleButton = document.getElementById("shuffle-button");
      shuffleButton.addEventListener("click", () => {
        const allCards = document.querySelectorAll(".card");
        allCards.forEach((card) => card.classList.remove("flipped"));
        shuffleArray(nameList);
        renderCards(nameList);
      });

      renderCards(nameList);
    </script>
  </body>
</html>
